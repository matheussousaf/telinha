<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>telinha — watch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <meta name="theme-color" content="#101116">
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="page-watch">
    <main>
      <header class="topbar">
        <a class="brand" href="/">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <defs><linearGradient id="tg-watch" x1="0" y1="0" x2="1" y2="1">
              <stop stop-color="#6E7CFF"/><stop offset="1" stop-color="#4F5FF0"/>
            </linearGradient></defs>
            <rect x="2" y="3.5" width="20" height="14" rx="4" fill="url(#tg-watch)"/>
            <path d="M10 8.25v4.5l4.25-2.25L10 8.25z" fill="#fff"/>
            <rect x="8" y="19.5" width="8" height="2" rx="1" fill="#343850"/>
          </svg>
          <span>telinha</span>
        </a>
        <span class="sep" aria-hidden="true"></span>
        <h1 id="title">…</h1>
      </header>
      <div class="video-wrap">
        <video autoplay playsinline muted></video>
        <div id="overlay" class="overlay">Connecting…</div>
      </div>
      <div class="controls">
        <button id="unmute">🔊 Unmute</button>
        <button id="pip" class="secondary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="14" rx="2"/><rect x="12" y="11" width="7" height="5" rx="1" fill="currentColor" stroke="none"/></svg>
          Pop out
        </button>
        <button id="full" class="secondary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/></svg>
          Fullscreen
        </button>
        <span id="count" class="pill">0 watching</span>
        <span id="game" class="pill hidden"></span>
      </div>
      <p class="muted tip">
        Tip: “Pop out” floats the stream in an always-on-top mini-window — park it in a corner over
        Discord and keep chatting.
      </p>
    </main>
    <script type="module" src="/watch.js"></script>
  </body>
</html>
